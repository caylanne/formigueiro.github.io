{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar Doação | Formigueiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'assets/Css/doar.css' %}">
  <script src="{% static 'assets/Js/comum.js' %}" defer></script>
  <script src="{% static 'assets/Js/doar.js' %}" defer></script>
</head>
<body>

  <header class="topo">
    <div class="topo-conteudo">
      <a href="{% url 'home_doador' %}" class="logo" aria-label="Formigueiro, página inicial">
        <span class="logo-icone">F</span>
        <span class="logo-texto">
          <span class="logo-nome">Formigueiro</span>
          <span class="logo-sub">Doações locais em Patos-PB</span>
        </span>
      </a>

      <nav class="menu" aria-label="Navegação principal">
        <a href="{% url 'home_doador' %}" class="ativo">Campanhas</a>
      </nav>

      <a href="{% url 'perfil_doador' %}" class="perfil" aria-label="Meu perfil">
        <span class="perfil-nome">Seu Nome</span>
        <span class="avatar">DA</span>
      </a>
    </div>
  </header>

  <main class="pagina" id="pagina" data-url-home-doador="{% url 'home_doador' %}" data-url-campanha="{% url 'campanha' %}">

    <aside class="lateral">
      <div class="cabecalho">
        <a href="{% url 'home_doador' %}" class="voltar" id="link-voltar" aria-label="Voltar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <h1>Registrar Doação</h1>
      </div>

      <section class="campanha" aria-label="Campanha selecionada">
        <p class="campanha-rotulo">Campanha selecionada</p>
        <h2 id="campanha-titulo"></h2>
        <p class="campanha-texto" id="campanha-texto"></p>
      </section>
    </aside>

    <section class="cartao">
      <form id="form-doacao" action="#" method="post" novalidate>

        <div class="campo">
          <label for="item">O que você vai doar?</label>
          <select id="item" name="item"></select>
        </div>

        <div class="campo">
          <span class="rotulo" id="rotulo-qtd">Quantidade</span>
          <div class="quantidade" role="group" aria-labelledby="rotulo-qtd">
            <button type="button" class="qtd-botao qtd-menos" id="qtd-menos" aria-label="Diminuir quantidade">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
            </button>
            <output class="qtd-valor" id="qtd-valor" aria-live="polite">1 Unidade</output>
            <button type="button" class="qtd-botao qtd-mais" id="qtd-mais" aria-label="Aumentar quantidade">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
          <p class="erro" id="erro-quantidade" role="alert"></p>
        </div>

        <fieldset class="campo entrega">
          <legend class="rotulo">Como deseja entregar?</legend>
          <div class="opcoes">
            <label class="opcao">
              <input type="radio" name="entrega" value="levar" checked>
              <span class="opcao-corpo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17H3v-5l2-5h11l3 5h2v5h-2"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/><path d="M9.5 17h5M3 12h16"/></svg>
                <strong>Vou levar lá</strong>
                <small>Entrega direta na ONG</small>
              </span>
            </label>
            <label class="opcao">
              <input type="radio" name="entrega" value="coletar">
              <span class="opcao-corpo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V21H3z"/><path d="M9 21v-7h6v7"/></svg>
                <strong>Coletar em casa</strong>
                <small>A ONG retira com você</small>
              </span>
            </label>
          </div>
        </fieldset>

        <div class="previsao">
          <span class="rotulo">Previsão de entrega</span>
          <div class="previsao-campos">
            <div class="seletor">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              <select id="dia" name="dia" aria-label="Dia da entrega"></select>
            </div>
            <div class="seletor">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              <select id="horario" name="horario" aria-label="Horário da entrega"></select>
            </div>
          </div>
        </div>

        <div id="mensagem-form" class="aviso" role="status" hidden></div>

        <button type="submit" class="botao">Confirmar Minha Doação</button>
        <p class="nota">Ao confirmar, a ONG reservará espaço para receber seus itens.</p>
      </form>
    </section>

  </main>

</body>
</html>
